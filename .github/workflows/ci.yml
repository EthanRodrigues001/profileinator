name: ci
on: [push, pull_request]
jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: hq }
      - run: cargo build --release --manifest-path hq/Cargo.toml
      - run: cargo clippy --manifest-path hq/Cargo.toml -- -D warnings
        continue-on-error: true
  ui:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci
      - run: npm run build   # also type-checks
