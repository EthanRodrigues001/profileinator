name: release
# Push a tag like v0.2.0 to publish: the native installers (Windows setup exe, macOS dmg, Linux AppImage/deb) with signed
# auto-update files (latest.json), plus plain archives (hq + dashboard + skill) for the install scripts.
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (see CONTRIBUTING.md).
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  archives:
    needs: create
    strategy:
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, exe: hq.exe }
          - { os: macos-latest, name: macos-arm64, exe: hq }
          - { os: ubuntu-latest, name: linux-x64, exe: hq }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        shell: bash
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci && npm run build
        working-directory: ui
      - run: cargo build --release --manifest-path hq/Cargo.toml
      - name: Package
        shell: bash
        run: |
          d=profileinator-${{ matrix.name }}
          mkdir -p $d
          cp hq/target/release/${{ matrix.exe }} $d/
          cp -r ui/out $d/ui
          cp -r skills $d/skills
          cp README.md LICENSE $d/
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a $d.zip $d; else tar czf $d.tar.gz $d; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            profileinator-*.zip
            profileinator-*.tar.gz

  installer:
    # hq and the dashboard are bundled inside; tauri-action also uploads latest.json + signatures for the in-app updater.
    needs: create
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        shell: bash
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci && npm run build
        working-directory: ui
      - run: cargo build --release --manifest-path hq/Cargo.toml
      - name: Bundle hq
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/bin
          cp hq/target/release/hq hq/target/release/hq.exe desktop/src-tauri/bin/ 2>/dev/null || true
      - run: npm ci
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Profileinator ${{ github.ref_name }}
          releaseDraft: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
